# config.yaml
dataset:
  dataroot: ./data/SNC_valid
  train_split: train
  test_split: test

model:
  input_nc: 1
  output_nc: 4
  conv_layers: 5
  num_plane: 3
  num_quat: 3
  use_bn: true
  activation: lrelu

loss:
  grid_size: 32
  grid_bound: 0.5
  ref_weight: 1.0
  rot_weight: 1.0
  reg_plane_weight: 1.0
  reg_rot_weight: 1.0
  w_sym_reg: 25

training:
  batch_size: 256
  epochs: 100
  learning_rate: 0.004
  seed: 42
  device: cuda

output:
  save_dir: ./checkpoints
  log_dir: ./logs

testing:
  checkpoint: ./checkpoints/20250731-214831/00099_net_PRSNet.pth